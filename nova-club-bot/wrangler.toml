# Configuration Cloudflare du bot NOVA CLUB.
# Aucun secret ici : le token et les identifiants sont dans les secrets Cloudflare.
name = "nova-club-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Images (bannières GIF, etc.) servies gratuitement par Cloudflare depuis le dossier public/.
# Exemple : public/banniere-tickets.gif -> https://nova-club-bot.novaclub.workers.dev/banniere-tickets.gif
# Les requêtes vers ces fichiers sont gratuites et illimitées ; tout le reste (dont la page
# « en ligne ✅ » à la racine et les interactions Discord) est traité par le Worker.
[assets]
directory = "./public"
# Permet au bot de lire ses propres images (env.ASSETS) pour les envoyer comme pièces jointes à Discord.
binding = "ASSETS"

# Stockage des tickets ouverts (Cloudflare KV, gratuit).
[[kv_namespaces]]
binding = "TICKETS"
id = "a693b12728f0444e95be152943f837e3"

# Journaux visibles dans le tableau de bord Cloudflare (Workers > nova-club-bot > Logs)
[observability]
enabled = true
