# Déploie automatiquement le bot NOVA CLUB sur Cloudflare Workers
# à chaque modification du dossier nova-club-bot/ poussée sur la branche main.
name: Déployer nova-club-bot

on:
  push:
    branches: [main]
    paths:
      - "nova-club-bot/**"
      - ".github/workflows/deploy-nova-club-bot.yml"
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

concurrency:
  group: deploy-nova-club-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-club-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-club-bot/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      # Bloque le déploiement si une image de public/ manque : sinon elle disparaîtrait du site.
      - name: Vérifier les images
        run: npm run check-images -- --local

      - name: Déployer sur Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
